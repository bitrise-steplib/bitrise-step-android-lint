format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

app:
  envs:
  - ORIG_BITRISE_SOURCE_DIR: $BITRISE_SOURCE_DIR
  - BITRISE_STEP_GIT_CLONE_URL: https://github.com/bitrise-steplib/bitrise-step-android-lint.git
  - MY_STEPLIB_REPO_FORK_GIT_URL: $MY_STEPLIB_REPO_FORK_GIT_URL
  - SIMPLE_REPO_GIT_CLONE_URL: https://github.com/bitrise-samples/android-multiple-test-results-sample.git
  - JDK_VERSION: "11"

workflows:
  test_simple-and-scaffolded-nested:
    title: Test simple android project & scaffolded nested project
    steps:
    - script:
        inputs:
        - content: |
            #!/bin/bash
            rm -rf "$ORIG_BITRISE_SOURCE_DIR/_tmp"
    - change-workdir:
        title: cd $ORIG_BITRISE_SOURCE_DIR/_tmp
        run_if: true
        inputs:
        - path: $ORIG_BITRISE_SOURCE_DIR/_tmp
        - is_create_path: true
    - script:
        inputs:
        - content: |
            #!/bin/bash
            git clone $SIMPLE_REPO_GIT_CLONE_URL .
    - set-java-version@1:
        run_if: $.IsCI
        inputs:
        - set_java_version: $JDK_VERSION
    - install-missing-android-tools:
        inputs:
        - gradlew_path: ./gradlew
    - path::./:
        title: Test simple android project
        inputs:
        - arguments: --debug
        - module: app
        - variant: Debug
    - change-workdir:
        title: cd $ORIG_BITRISE_SOURCE_DIR/_tmp/nested/deep/subdir
        run_if: true
        inputs:
        - path: $ORIG_BITRISE_SOURCE_DIR/_tmp/nested/deep/subdir
        - is_create_path: true
    - script:
        title: Scaffold minimal android project + wrapper
        inputs:
        - content: |
            #!/bin/bash
            set -euo pipefail
            mkdir -p app/src/main/res/values
            cat > settings.gradle <<'EOF'
            rootProject.name = 'nested-fixture'
            include ':app'
            EOF
            cat > build.gradle <<'EOF'
            buildscript {
                repositories { google(); mavenCentral() }
                dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }
            }
            allprojects { repositories { google(); mavenCentral() } }
            EOF
            cat > app/build.gradle <<'EOF'
            apply plugin: 'com.android.application'
            android {
                namespace 'com.example.fixture'
                compileSdk 34
                defaultConfig { applicationId 'com.example.fixture'; minSdk 24 }
            }
            EOF
            cat > app/src/main/AndroidManifest.xml <<'EOF'
            <?xml version="1.0" encoding="utf-8"?>
            <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                <application android:label="fixture"/>
            </manifest>
            EOF
            cat > app/src/main/res/values/strings.xml <<'EOF'
            <resources><string name="app_name">fixture</string></resources>
            EOF
            gradle wrapper --gradle-version 7.6.4 --distribution-type all
    - install-missing-android-tools:
        inputs:
        - gradlew_path: ./gradlew
    - path::./:
        title: Test scaffolded nested project (defaults)
    - path::./:
        title: Test scaffolded nested project (module + variant)
        inputs:
        - module: app
        - variant: Debug
